<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>test6 and countのみ表示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            overflow-y: auto;
            border-right: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        #map {
            flex: 1;
        }

        .location-item {
            margin-bottom: 12px;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h2>金沢市混雑マップ</h2>
    </div>
    <div id="map"></div>

    <script>
        const locations = [
            {
                title: "金沢21世紀美術館",
                position: { lat: 36.5610178, lng: 136.6585197 },
                address: "〒920-8509 石川県金沢市広坂1丁目2−1",
                info: "現代アートが楽しめる美術館",
                image: "https://www4.city.kanazawa.lg.jp/material/images/group/5/01.jpg",
                link: "https://maps.app.goo.gl/jeqGQzfB9h5KS5kw7",
            },
        ];

        let activeInfoWindow = null;
        //開かれている吹き出しをnullとする。marker.addListenerに影響

        //マップを表示させる
        async function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 36.568170, lng: 136.657744 },
                zoom: 15,
                mapId: "3f993d0ee7d461f731da98ee",
            });

            const sidebar = document.getElementById('sidebar');

            locations.forEach(loc => {
                const marker = new google.maps.marker.AdvancedMarkerElement({
                    //google.maps.Marker is deprecated. Instead use google.maps.marker.AdvancedMarkerElement
                    position: loc.position,
                    map: map,
                    //title: "金沢市街",
                });

                // 吹き出し設定
                const infoWindow = new google.maps.InfoWindow({
                    content: `
                <div>
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 4px;">${loc.title}</div>
                    <img src="${loc.image}" alt="${loc.title}" style="width: 100%; height: auto;"><br>
                    <div style= "margin-top: auto;">${loc.info}<br>
                        
                    <h3><div class="item">現在の人数：<span id="Count"></span>人</div></h3>
                    <div class="item"><span id="Hour"></span>時<span id="Min"></span>分現在</div>

                    ${loc.address}<br>
                    <a href= "${loc.link}"> Googleマップで見る </a>
                </div>
            `
                });

                //マーカー選択後に吹き出し表示
                marker.addListener("click", () => {
                    if (activeInfoWindow) activeInfoWindow.close();
                    infoWindow.open(map, marker);
                    activeInfoWindow = infoWindow;

                    //吹き出しが開かれた後にfetchでifdlからデータ取得
                    async function getData() {
                        try {
                            let headersList = {
                                "Accept": "*/*",
                                "User-Agent": "Thunder Client (https://www.thunderclient.com)",
                                "Content-Type": "text/plain"
                            }

                            let bodyContent = JSON.stringify({
                                "mac": "4827e2e3b74c"
                            });

                            let response = await fetch("https://ifdl.jp/akita/WiScount/getlog.php", {
                                method: "POST",
                                body: bodyContent,
                                headers: headersList
                            });

                            let data = await response.json();//jsonとして表示
                            //await response.textだからtext形式で画面上に表示される。jsonにしたらJSON形式
                            console.log(data); //開発者コンソールでの確認用


                            //画面上に表示
                            document.getElementById("Count").textContent = data.Count;
                            document.getElementById("Hour").textContent = data.Hour;
                            document.getElementById("Min").textContent = data.Min;
                            //JSON.stringify(data, null, 2);
                        } catch (error) {
                            document.getElementById("Count").textContent = "エラー:" + error;
                            document.getElementById("Hour").textContent = "エラー:" + error;
                            document.getElementById("Min").textContent = "エラー:" + error;
                        }
                    }
                    getData();
                });

                infoWindow.addListener('closeclick', () => {
                    activeInfoWindow = null;
                });

                //sidebarの要素設定
                const item = document.createElement("div");
                item.className = "location-item";
                item.innerHTML = `
          <div class="location-title"><strong>${loc.title}</strong></div>
          <div class="location-address">${loc.address}</div>
        `;
                item.addEventListener("click", () => {
                    map.panTo(loc.position);
                    if (activeInfoWindow) activeInfoWindow.close();
                    infoWindow.open(map, marker);
                    activeInfoWindow = infoWindow;
                });

                sidebar.appendChild(item);

            });
        }

        //コピペ

        window.initMap = initMap;


    </script>

    <!-- Google Maps API 読み込み：callbackで initMap を自動実行 -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCSsUGfSG2nndTiOuyrYilrZ7gm5YjolQg&callback=initMap&loading=async&v=beta&libraries=marker">
            async
            defer
        </script>
</body>

</html>
